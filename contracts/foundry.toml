[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Whitechain hardfork unconfirmed: paris avoids PUSH0/MCOPY.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
# Required: payWithAuthorization's spec signature hits "stack too deep" without via-IR.
via_ir = true

[fuzz]
runs = 512

[rpc_endpoints]
whitechain = "${WC_RPC}"
sepolia = "${SEPOLIA_RPC}"
